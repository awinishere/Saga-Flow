services:
  order-db:
    image: postgres:16-alpine
    container_name: saga-flow-inventory-db
    hostname: inventory-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: admin4321
    volumes:
      - inventory-db-data:/var/lib/postgresql/data

volumes:
  inventory-db-data: